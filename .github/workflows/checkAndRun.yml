name: checkAndRun

on:
  repository_dispatch:
    types: [checkAndRun]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TiDB_Host: ${{ secrets.TiDB_Host }}
  TiDB_User: ${{ secrets.TiDB_User }}
  TIDB_PASS: ${{ secrets.TIDB_PASS }}
  TIDB_NAME: ${{ secrets.TIDB_NAME }}
  FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
  FUGLE_TOKEN: ${{ secrets.FUGLE_TOKEN }}
  GEMINI_TOKEN: ${{ secrets.GEMINI_TOKEN }}
  LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
  LINE_TARGET: ${{ secrets.LINE_TARGET }}
  GAS_URL_TRIGGERS: ${{ secrets.GAS_URL_TRIGGERS }}

jobs:
  stock_job:
    runs-on: ubuntu-latest

    steps:
    - name: Check Code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: pdo, pdo_mysql

    - name: Run Update
      run: php checkAndRun.php

    - name: Commit And Push JSON files
      id: commit_step
      if: always()
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add .
        if git diff --cached --quiet; then
          echo "沒有偵測到新的檔案變更，略過提交。"
          echo "has_changes=false" >> $GITHUB_OUTPUT
        else
          git commit -m "自動更新股票分析數據: $(date +'%Y-%m-%d %H:%M')"
          git push
          echo "has_changes=true" >> $GITHUB_OUTPUT
        fi

    - name: Sync data folder to FTP
      if: success() && steps.commit_step.outputs.has_changes == 'true'
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./data/
        server-dir: /htdocs/data/
        dangerous-clean-slate: true